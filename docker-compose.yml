services:
  bridge:
    # The newest release. Set BRIDGE_TAG in .env to pin a version (e.g. 0.1.0)
    # or to follow main (edge) or development (dev).
    image: ghcr.io/mathiasbk/openprinttag-spoolman:${BRIDGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      WEB_PORT: ${WEB_PORT:-7913}
    ports:
      - "${WEB_PORT:-7913}:${WEB_PORT:-7913}"
    volumes:
      - ./data:/data:Z
      - /etc/localtime:/etc/localtime:ro
