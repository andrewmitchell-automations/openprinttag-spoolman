name: Release

# Runs by itself whenever something lands on main, normally a merged pull
# request. The version goes up by minor unless the pull request carries one
# of these labels:
#   release:major  raise the major number
#   release:patch  raise the patch number
#   release:skip   do not release this merge
# It can also be started by hand from the Actions tab.
#
# The release commit this workflow pushes cannot start it again: pushes made
# with GITHUB_TOKEN never trigger workflows, and the plan job also skips
# commits that start with "Release v".

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
    steps:
      - name: Decide how far to bump
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            bump="$INPUT_BUMP"
          elif [[ "$HEAD_MESSAGE" == "Release v"* ]]; then
            bump=none
          else
            labels=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
            echo "Pull request labels: ${labels:-none}"
            if grep -qx 'release:skip' <<< "$labels"; then
              bump=none
            elif grep -qx 'release:major' <<< "$labels"; then
              bump=major
            elif grep -qx 'release:patch' <<< "$labels"; then
              bump=patch
            else
              bump=minor
            fi
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Bump: $bump"

  release:
    needs: plan
    if: needs.plan.outputs.bump != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Run the tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest

      - name: Work out the new version
        id: version
        run: |
          set -euo pipefail
          previous=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          IFS=. read -r major minor patch <<< "${previous#v}"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          case "${{ needs.plan.outputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          {
            echo "previous=$previous"
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (previous: ${previous:-none})"

      - name: Collect the changes since the last release
        id: notes
        run: |
          set -euo pipefail
          previous="${{ steps.version.outputs.previous }}"
          if [ -n "$previous" ]; then
            git log --no-merges --reverse --pretty='- %s' "$previous..HEAD" > /tmp/notes.md
          else
            # The first release would otherwise list the whole history.
            echo "- First tagged release." > /tmp/notes.md
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "No commits since $previous, so there is nothing to release." >&2
            exit 1
          fi
          cat /tmp/notes.md

      - name: Update VERSION and CHANGELOG.md
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          echo "$version" > VERSION
          entry="## $version - $(date -u +%Y-%m-%d)"
          {
            printf '%s\n\n' "$entry"
            cat /tmp/notes.md
          } > /tmp/entry.md
          awk 'FNR==NR { entry = entry $0 "\n"; next }
               { print }
               /^<!-- new releases go below this line -->$/ && !done { printf "\n%s", entry; done = 1 }' \
            /tmp/entry.md CHANGELOG.md > /tmp/changelog.md
          mv /tmp/changelog.md CHANGELOG.md
          head -n 20 CHANGELOG.md

      - name: Commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            cat /tmp/notes.md
            printf '\n**Docker image:** `ghcr.io/%s:%s`\n' \
              "${{ github.repository }}" "${{ steps.version.outputs.version }}"
          } > /tmp/release-body.md
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-body.md
